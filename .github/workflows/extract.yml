name: Extract Meal Reset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o Meal_Reset_V3_IA.zip -d extracted
          cp -r extracted/*/* .
          rm -rf extracted
          rm Meal_Reset_V3_IA.zip

      - name: Save files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract Meal Reset project" || true
          git push
